# nabd as a Nagios / Icinga 1 plugin.
#
# Local:  the command runs on the monitoring server itself.
# Remote: run it with NRPE. In /etc/nagios/nrpe.cfg (or nrpe.d/nabd.cfg) on the monitored host:
#   command[check_nabd]=/usr/bin/nabd --nagios
# and use check_nrpe!check_nabd here.
#
# nabd sees more as root. With NRPE, allow only this exact command in sudoers:
#   nagios ALL=(root) NOPASSWD: /usr/bin/nabd --nagios
# and use: command[check_nabd]=/usr/bin/sudo /usr/bin/nabd --nagios

define command {
    command_name    check_nabd
    command_line    /usr/bin/nabd --nagios $ARG1$
}

define service {
    use                     generic-service
    host_name               localhost
    service_description     nabd
    check_command           check_nabd!--skip=cpu
    check_interval          5
}
