name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.19 is the oldest supported Go (Debian 12); stable is the newest
        go: ["1.19", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false   # no dependencies, nothing to cache
      - name: gofmt
        if: matrix.go == 'stable'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: build every architecture
        run: |
          for arch in $(go tool dist list | grep '^linux/' | cut -d/ -f2); do
            echo "== $arch"; CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o /dev/null ./cmd/nabd
          done
          for v in 5 6 7; do CGO_ENABLED=0 GOARCH=arm GOARM=$v go build -o /dev/null ./cmd/nabd; done
          for a in mips mipsle; do CGO_ENABLED=0 GOARCH=$a GOMIPS=softfloat go build -o /dev/null ./cmd/nabd; done
          for a in mips64 mips64le; do CGO_ENABLED=0 GOARCH=$a GOMIPS64=softfloat go build -o /dev/null ./cmd/nabd; done
          CGO_ENABLED=0 GOARCH=386 GO386=softfloat go build -o /dev/null ./cmd/nabd
      - name: build the release binary
        if: matrix.go == 'stable'
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o nabd ./cmd/nabd
      - name: run on the runner
        if: matrix.go == 'stable'
        run: |
          ./nabd -v || true
          sudo ./nabd --json > report.json || test $? -le 3
          grep -q '"schema": "nabd/1"' report.json
          if grep -q '\.error"' report.json; then echo "a check failed (a bug)"; exit 1; fi
          ./nabd why disk / || true
          ./nabd why slow || true
          ./nabd changes --since 2h || true
      - uses: actions/upload-artifact@v4
        if: matrix.go == 'stable'
        with:
          name: nabd
          path: nabd

  cpus:
    name: tests on ${{ matrix.arch }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }} (QEMU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the release builds (.goreleaser.yaml), run in an emulator
          - { arch: "386", qemu: i386, variant: GO386=softfloat }
          - { arch: arm, qemu: arm, variant: GOARM=5 }
          - { arch: arm, qemu: arm, variant: GOARM=6 }
          - { arch: arm, qemu: arm, variant: GOARM=7 }
          - { arch: arm64, qemu: aarch64 }
          - { arch: loong64, qemu: loongarch64 }
          - { arch: mips, qemu: mips, variant: GOMIPS=softfloat }
          - { arch: mipsle, qemu: mipsel, variant: GOMIPS=softfloat }
          - { arch: mips64, qemu: mips64, variant: GOMIPS64=softfloat }
          - { arch: mips64le, qemu: mips64el, variant: GOMIPS64=softfloat }
          - { arch: ppc64, qemu: ppc64 }
          - { arch: ppc64le, qemu: ppc64le }
          - { arch: riscv64, qemu: riscv64 }
          - { arch: s390x, qemu: s390x }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: install QEMU
        run: |
          sudo apt-get update -qq
          # qemu-user-static until Ubuntu 24.04; newer releases ship the static emulators in qemu-user
          sudo apt-get install -y -qq qemu-user-static >/dev/null 2>&1 || sudo apt-get install -y -qq qemu-user >/dev/null
          q=$(command -v qemu-${{ matrix.qemu }}-static || command -v qemu-${{ matrix.qemu }}) \
            || { echo "::error::no qemu-${{ matrix.qemu }} on $(. /etc/os-release; echo $PRETTY_NAME)"; exit 1; }
          echo "QEMU=$q" >> "$GITHUB_ENV"
      - name: go test in the emulator
        run: |
          env CGO_ENABLED=0 GOARCH=${{ matrix.arch }} ${{ matrix.variant }} go test -count=1 -exec "$QEMU" ./... > test.log 2>&1 \
            || { tail -c 900 test.log | tr '\n' ' ' | sed 's/^/::error::/'; echo; exit 1; }
          grep -c '^ok' test.log
      - name: check this runner with the ${{ matrix.arch }} binary
        run: |
          env CGO_ENABLED=0 GOARCH=${{ matrix.arch }} ${{ matrix.variant }} go build -trimpath -o nabd ./cmd/nabd
          file nabd
          q=$QEMU
          $q ./nabd version
          sudo $q ./nabd --json > report.json || test $? -le 3
          grep -q '"schema": "nabd/1"' report.json
          if grep -q '\.error"' report.json; then echo "a check failed (a bug)"; exit 1; fi
          $q ./nabd why disk / >/dev/null || true

  distros:
    name: run on ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # old and new versions of each family: one static binary must run on all of them
        image:
          - centos:7
          - rockylinux:8
          - rockylinux:9
          - almalinux:8
          - almalinux:9
          - almalinux:10
          - oraclelinux:8
          - oraclelinux:9
          - quay.io/centos/centos:stream9
          - quay.io/centos/centos:stream10
          - amazonlinux:2
          - amazonlinux:2023
          - fedora:latest
          - fedora:rawhide
          - debian:10
          - debian:11
          - debian:12
          - debian:13
          - ubuntu:16.04
          - ubuntu:18.04
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - alpine:3.14
          - alpine:latest
          - alpine:edge
          - opensuse/leap:15.6
          - opensuse/tumbleweed
          - archlinux:latest
          - kalilinux/kali-rolling
          - gentoo/stage3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nabd
      - name: nabd in ${{ matrix.image }}
        run: |
          chmod +x nabd
          docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" sh -c '
            set -u
            cd /tmp
            /w/nabd version
            /w/nabd -v; echo "exit $?"
            /w/nabd --json > report.json; code=$?
            [ "$code" -le 3 ] || exit 1
            grep -q "\"schema\": \"nabd/1\"" report.json || exit 1
            if grep -q "\.error\"" report.json; then echo "a check failed"; exit 1; fi
            /w/nabd why disk; /w/nabd why memory; /w/nabd changes --since 1w
            NABD_STATE_DIR=/tmp/state /w/nabd snapshot || exit 1
            NABD_STATE_DIR=/tmp/state /w/nabd diff; [ $? -le 2 ] || exit 1
            echo OK'

  packages:
    name: build and install the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: install the packages
        run: |
          ls -la dist
          fails=0
          t() {   # platform image file install-command: install the package, run nabd, report a failure as an annotation
            echo "== $1 $2 $3"
            if ! out=$(docker run --rm --platform "$1" -v "$PWD/dist:/d:ro" "$2" sh -c "$4 /d/$3 && nabd version && { nabd --json >/tmp/r.json; test \$? -le 3; } && grep -q nabd/1 /tmp/r.json" 2>&1); then
              echo "$out"
              echo "::error::$3 on $2 ($1): $(echo "$out" | tail -n 4 | tr '\n' ' ')"
              fails=$((fails + 1))
            fi
          }
          t linux/amd64   debian:12        nabd_amd64.deb   "apt-get update -qq && apt-get install -y -qq"
          t linux/amd64   fedora:latest    nabd_amd64.rpm   "dnf install -y -q"
          t linux/amd64   alpine:latest    nabd_amd64.apk   "apk add -q --allow-untrusted"
          t linux/amd64   archlinux:latest nabd_amd64.pkg.tar.zst "pacman -U --noconfirm"
          # old package tools: rpm 4.11 (CentOS 7), dpkg 1.18 (Ubuntu 16.04)
          t linux/amd64   centos:7         nabd_amd64.rpm   "rpm -Uvh"
          t linux/amd64   ubuntu:16.04     nabd_amd64.deb   "dpkg -i"
          docker run --rm -v "$PWD/dist:/d:ro" debian:12 sh -c 'dpkg -i /d/nabd_amd64.deb >/dev/null && test -f /usr/lib/systemd/system/nabd-snapshot.timer' \
            || { echo "::error::the systemd timer is missing from the .deb"; fails=$((fails + 1)); }
          test "$fails" -eq 0
      - uses: docker/setup-qemu-action@v3
      - name: install the packages on other CPUs
        run: |
          fails=0
          t() {
            echo "== $1 $2 $3"
            if ! out=$(docker run --rm --platform "$1" -v "$PWD/dist:/d:ro" "$2" sh -c "$4 /d/$3 && nabd version && { nabd --json >/tmp/r.json; test \$? -le 3; } && grep -q nabd/1 /tmp/r.json" 2>&1); then
              echo "$out"
              echo "::error::$3 on $2 ($1): $(echo "$out" | tail -n 4 | tr '\n' ' ')"
              fails=$((fails + 1))
            fi
          }
          t linux/arm64    rockylinux:9  nabd_arm64.rpm    "rpm -Uvh"
          t linux/arm64    debian:12     nabd_arm64.deb    "dpkg -i"
          t linux/arm/v7   debian:12     nabd_armv7.deb    "dpkg -i"
          t linux/arm/v5   debian:12     nabd_armv5.deb    "dpkg -i"
          t linux/arm/v6   alpine:latest nabd_armv6.apk    "apk add -q --allow-untrusted"
          t linux/386      debian:12     nabd_386.deb      "dpkg -i"
          t linux/ppc64le  almalinux:9   nabd_ppc64le.rpm  "rpm -Uvh"
          t linux/s390x    ubuntu:24.04  nabd_s390x.deb    "dpkg -i"
          t linux/riscv64  ubuntu:24.04  nabd_riscv64.deb  "dpkg -i"
          t linux/mips64le debian:12     nabd_mips64le.deb "dpkg -i"
          test "$fails" -eq 0
